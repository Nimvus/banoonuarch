<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-Nim</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="./images/favicon.jpg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="casceding.css">
</head>
<body>
    <!--Quiz Configuration Container-->
    <div class="config-container">
        <h2 class="config-title">Quiz Configuration</h2>

        <div class="config-option">
            <h4 class="option-title">Subjects</h4>
                <div class="category-options">
                    <button class="category-option active">Programming</button>
                    <button class="category-option">Geography</button>
                    <button class="category-option">Mathematics</button>
                    <button class="category-option">Entertaiment</button>
                </div>
            </div>

            <div class="config-option">
                <h4 class="option-title">No. of Questions</h4>
                <div class="question-options">
                    <button class="question-option">8</button>
                </div>
            </div>

            <button class="start-quiz-btn">Start Quiz</button>
        </div>

        <!--Quiz Container-->
        <div class="quiz-container">
            <header class="quiz-header">
                <h2 class="quiz-title">Quiz Application</h2>
                <div class="quiz-timer">
                    <span class="material-symbols-rounded">timer</span>
                    <p class="time-duration">15s</p>
                </div>
            </header>

            <div class="quiz-content">
                <h1 class="question-text"></h1>
                <ul class="answer-options"></ul>
            </div>
            <div class="quiz-footer">
                <p class="question-status"></p>
                <button class="next-question-btn">
                    Next
                    <span class="material-symbols-rounded">arrow_right_alt</span>
                </button>
            </div>
        </div>
<!--Result Container-->
        <div class="result-container">
            <img src="./done.png" alt="result-img">
            <h2 class="result-title">Quiz Completed</h2>
            <p class="result-message"></p>
            <a href="./index.html"><button class="try-again-btn">Try Again</button></a>
        </div>
    </div> 
    <script src="questions.js"></script>
    <script src="script5.js"></script>   
</body>
</html>
